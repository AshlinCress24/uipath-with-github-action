name: UiPath CI/CD Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download UiPath CLI and Pack Project
        shell: pwsh
        run: |
          $cliDirNamePattern = "uipathcli_*"
          $workspace = "${{ github.workspace }}"

          Write-Host "Downloading UiPath CLI..."
          pwsh ./scripts/DownloadUiPathCli.ps1 -WorkspacePath $workspace

          Write-Host "Locating extracted UiPath CLI directory..."
          $cliDir = Get-ChildItem -Path $workspace -Directory | Where-Object { $_.Name -like $cliDirNamePattern } | Sort-Object LastWriteTime -Descending | Select-Object -First 1

          if (-not $cliDir) {
            Write-Error "Cannot find UiPath CLI directory after download."
            exit 1
          }
          Write-Host "Found UiPath CLI directory: $($cliDir.FullName)"

          Write-Host "Adding CLI directory to PATH for current session..."
          $env:Path = "$($cliDir.FullName);$env:Path"

          Write-Host "Setting UIPATH_CLI_EXECUTABLE_NAME environment variable..."
          $env:UIPATH_CLI_EXECUTABLE_NAME = "uipath.exe"

          Write-Host "Starting UiPath Pack..."
          pwsh ./scripts/UiPathPack.ps1 `
            -project_path "$workspace/project.json" `
            -output_path "$workspace/output_packages"

      - name: Upload UiPath Package as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uipath-package
          path: ${{ github.workspace }}/output_packages/*.nupkg

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download UiPath CLI and Deploy Package
        shell: pwsh
        env:
          ORCH_CLIENT_ID: ${{ secrets.ORCH_CLIENT_ID }}
          ORCH_CLIENT_SECRET: ${{ secrets.ORCH_CLIENT_SECRET }}
          ORCH_ORGANIZATION_NAME: ${{ secrets.ORCH_ORGANIZATION_NAME }}
          ORCH_TENANT: ${{ secrets.ORCH_TENANT }}
          ORCH_URL: ${{ secrets.ORCH_URL }}
        run: |
          $cliDirNamePattern = "uipathcli_*"
          $workspace = "${{ github.workspace }}"

          Write-Host "Downloading UiPath CLI..."
          pwsh ./scripts/DownloadUiPathCli.ps1 -WorkspacePath $workspace

          Write-Host "Locating extracted UiPath CLI directory..."
          $cliDir = Get-ChildItem -Path $workspace -Directory | Where-Object { $_.Name -like $cliDirNamePattern } | Sort-Object LastWriteTime -Descending | Select-Object -First 1

          if (-not $cliDir) {
            Write-Error "Cannot find UiPath CLI directory after download."
            exit 1
          }
          Write-Host "Found UiPath CLI directory: $($cliDir.FullName)"

          Write-Host "Adding CLI directory to PATH for current session..."
          $env:Path = "$($cliDir.FullName);$env:Path"

          Write-Host "Setting UIPATH_CLI_EXECUTABLE_NAME environment variable..."
          $env:UIPATH_CLI_EXECUTABLE_NAME = "uipath.exe"

      - name: Download UiPath Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: uipath-package
          path: ${{ github.workspace }}/downloaded_packages

      - name: Deploy UiPath Package to Orchestrator
        shell: pwsh
        env:
          ORCH_CLIENT_ID: ${{ secrets.ORCH_CLIENT_ID }}
          ORCH_CLIENT_SECRET: ${{ secrets.ORCH_CLIENT_SECRET }}
          ORCH_ORGANIZATION_NAME: ${{ secrets.ORCH_ORGANIZATION_NAME }}
          ORCH_TENANT: ${{ secrets.ORCH_TENANT }}
          ORCH_URL: ${{ secrets.ORCH_URL }}
        run: |
          pwsh ./scripts/UiPathDeploy.ps1 `
            -packages_path "${{ github.workspace }}/downloaded_packages" `
            -orchestrator_url "$env:ORCH_URL" `
            -organization_name "$env:ORCH_ORGANIZATION_NAME" `
            -orchestrator_tenant "$env:ORCH_TENANT" `
            -client_id "$env:ORCH_CLIENT_ID" `
            -client_secret "$env:ORCH_CLIENT_SECRET" `
            -folder_organization_unit ""
