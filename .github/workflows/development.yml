name: Development workflow

on:
  push:
    branches:
      - develop

# Here the environment variables are declared in workflow level
env:
  PROJECT_NAME: Addition_of_2_Numbers # Your confirmed UiPath project name
  PROJECT_FOLDER: . # Adjust if your project.json is in a subfolder relative to the repo root
  ORCH_URL: https://cloud.uipath.com
  ORCH_TENANT: ${{ secrets.ORCH_TENANT }}
  ORCH_CLIENT_ID: ${{ secrets.ORCH_CLIENT_ID }}
  ORCH_CLIENT_SECRET: ${{ secrets.ORCH_CLIENT_SECRET }}
  ORCH_DEV_FOLDER_PATH: Shared # <--- IMPORTANT: Change this if your Development Orchestrator Folder is NOT "Shared"
  ORCH_ORGANIZATION_NAME: ${{ secrets.ORCH_ORGANIZATION_NAME }}

jobs:
  print-details:
    runs-on: ubuntu-latest
    steps:
      - name: echo-default-env-variables
        run: |
          echo "Home: ${HOME}"
          echo "GITHUB_WORKFLOW: ${GITHUB_WORKFLOW}"
          echo "GITHUB_ACTIONS: ${GITHUB_ACTIONS}"
          echo "GITHUB_ACTOR: ${GITHUB_ACTOR}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "GITHUB_EVENT_NAME: ${GITHUB_EVENT_NAME}"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "GITHUB_REF: ${GITHUB_REF}"

  cleaner:
    runs-on: ubuntu-latest
    steps:
      - name: Runner workspace path
        run: |
          echo "Cleaning up previous run"
          rm -rf "${{ github.workspace }}"

  build-uipath-nuget-package:
    needs: cleaner
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Manually Setup UiPath CLI
        shell: pwsh
        run: |
          $cliDir = "${{ github.workspace }}\uipathcli"
          $installPath = $cliDir
          $zipPath = Join-Path $installPath "uipathcli.zip"

          # Changed URL to download v1.18.0 of uipcli.exe - CORRECT!
          $DownloadUrl = "https://download.uipath.com/platform/uipath-cli-v1.18.0.zip"

          Write-Host "Creating CLI directory: $installPath"
          New-Item -ItemType Directory -Path $installPath -Force | Out-Null

          Write-Host "Downloading UiPath CLI from $DownloadUrl to $zipPath"
          Invoke-WebRequest -Uri $DownloadUrl -OutFile $zipPath

          Write-Host "Extracting UiPath CLI to $installPath"
          Expand-Archive -Path $zipPath -DestinationPath $installPath -Force

          Write-Host "Adding UiPath CLI to PATH: $installPath"
          Add-Content -Path $env:GITHUB_PATH -Value $installPath

          Write-Host "Verifying uipcli.exe presence and version..."
          $cliExePath = Join-Path $installPath "uipcli.exe" # CORRECT: refers to uipcli.exe
          if (Test-Path $cliExePath) {
              Write-Host "uipcli.exe found at: $cliExePath"
              & $cliExePath --version
              & $cliExePath --help
          } else {
              Write-Error "uipcli.exe not found after extraction!"
              exit 1
          }
      
      - name: Verify Extracted CLI Content and Commands (Diagnostic)
        shell: pwsh
        run: |
          $cliDir = "$env:GITHUB_WORKSPACE\uipathcli"
          $cliExePath = Join-Path $cliDir "uipcli.exe" # FIX: Changed to uipcli.exe
          
          Write-Host "Listing contents of ${cliDir}:"
          Get-ChildItem -Path $cliDir -Recurse -Force | Format-Table -AutoSize
          
          if (Test-Path $cliExePath) {
              Write-Host "${cliExePath} exists!"
              Write-Host "Running '${cliExePath} --version':"
              & $cliExePath --version
              Write-Host "Running '${cliExePath} --help':"
              & $cliExePath --help
              # FIX: Removed the "Skipping 'package --help' check" line, it's not relevant here
          } else {
              Write-Error "${cliExePath} NOT FOUND! This should not happen at this stage."
              exit 1
          }

      - name: Build Nuget Package
        shell: pwsh
        run: |
          # The UiPathPack.ps1 script must also be updated to use uipcli.exe and its syntax
          ${{ github.workspace }}\scripts\UiPathPack.ps1 `
          -project_path "${{ github.workspace }}\${{ env.PROJECT_FOLDER }}\${{ env.PROJECT_NAME }}\project.json" `
          -output_path "${{ github.workspace }}\package"

      - name: Upload UiPath Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            package/*.*
            scripts/*.ps1

  publish-uipath-nuget-package:
    needs: build-uipath-nuget-package
    runs-on: windows-latest
    steps:
      - name: Download UiPath Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Artifacts
      
      - name: Manually Setup UiPath CLI
        shell: pwsh
        run: |
          $installPath = "$env:GITHUB_WORKSPACE\uipathcli"
          New-Item -ItemType Directory -Force -Path $installPath
          
          # FIX: Changed URL to download v1.18.0 of uipcli.exe
          $downloadUrl = "https://download.uipath.com/platform/uipath-cli-v1.18.0.zip"
          Write-Host "Downloading UiPath CLI from $downloadUrl"
          Invoke-WebRequest -Uri $downloadUrl -OutFile "$installPath\uipathcli.zip" -UseBasicParsing
          
          Write-Host "Extracting UiPath CLI to $installPath"
          Expand-Archive -Path "$installPath\uipathcli.zip" -DestinationPath $installPath -Force
          
          Write-Host "Adding '$installPath' to GITHUB_PATH (for potential future steps)"
          Add-Content -Path $env:GITHUB_PATH -Value $installPath

      - name: Verify Extracted CLI Content and Commands (Publish Job - Diagnostic)
        shell: pwsh
        run: |
          $cliDir = "$env:GITHUB_WORKSPACE\uipathcli"
          $cliExePath = Join-Path $cliDir "uipcli.exe" # FIX: Changed to uipcli.exe
          
          Write-Host "Listing contents of ${cliDir}:"
          Get-ChildItem -Path $cliDir -Recurse -Force | Format-Table -AutoSize
          
          if (Test-Path $cliExePath) {
              Write-Host "${cliExePath} exists!"
              Write-Host "Running '${cliExePath} --version':"
              & $cliExePath --version
              Write-Host "Running '${cliExePath} --help':"
              & $cliExePath --help
              # FIX: Removed the "Skipping 'package --help' check" line
          } else {
              Write-Error "${cliExePath} NOT FOUND! This should not happen at this stage."
              exit 1
          }

      - name: Publish Nuget Package to DEV
        shell: pwsh
        run: |
          # The UiPathDeploy.ps1 script must also be updated to use uipcli.exe and its syntax
          ${{ github.workspace }}\scripts\UiPathDeploy.ps1 `
          -packages_path "${{ github.workspace }}\package" `
          -orchestrator_url "${{ env.ORCH_URL }}" `
          -organization_name "${{ env.ORCH_ORGANIZATION_NAME }}" `
          -orchestrator_tenant "${{ env.ORCH_TENANT }}" `
          -client_id "${{ env.ORCH_CLIENT_ID }}" `
          -client_secret "${{ env.ORCH_CLIENT_SECRET }}" `
          -folder_organization_unit "${{ env.ORCH_DEV_FOLDER_PATH }}"

  create-pull-request:
    needs: publish-uipath-nuget-package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2
      - name: pull-request
        uses: repo-sync/pull-request@v2
        with:
          destination_branch: "master"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_label: "feature, automated pr"
          pr_title: "Pull Request From Github Action"
