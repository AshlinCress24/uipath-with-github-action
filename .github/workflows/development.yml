name: Development workflow

on:
  push:
    branches:
      - develop

# Here the environment variables are declared in workflow level
env:
  PROJECT_NAME: Addition_of_2_Numbers # !! IMPORTANT: Update this to your exact UiPath project name !!
  PROJECT_FOLDER: . # Adjust if your project.json is in a subfolder relative to the repo root (e.g., 'MyRPAProject')
  ORCH_URL: https://cloud.uipath.com # Typically this is correct for Cloud Orchestrator
  ORCH_TENANT: ${{ secrets.ORCH_TENANT }}
  ORCH_CLIENT_ID: ${{ secrets.ORCH_CLIENT_ID }}
  ORCH_CLIENT_SECRET: ${{ secrets.ORCH_CLIENT_SECRET }}
  ORCH_DEV_FOLDER_PATH: Shared # !! IMPORTANT: Change this if your Development Orchestrator Folder is NOT "Shared" !!
  ORCH_ORGANIZATION_NAME: ${{ secrets.ORCH_ORGANIZATION_NAME }} # Required for cloud.uipath.com login

jobs:
  print-details:
    runs-on: ubuntu-latest
    steps:
      - name: echo-default-env-variables
        run: |
          echo "Home: ${HOME}"
          echo "GITHUB_WORKFLOW: ${GITHUB_WORKFLOW}"
          echo "GITHUB_ACTIONS: ${GITHUB_ACTIONS}"
          echo "GITHUB_ACTOR: ${GITHUB_ACTOR}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "GITHUB_EVENT_NAME: ${GITHUB_EVENT_NAME}"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "GITHUB_REF: ${GITHUB_REF}"

  cleaner:
    runs-on: ubuntu-latest
    steps:
      - name: Runner workspace path
        run: |
          echo "Cleaning up previous run"
          rm -rf "${{ github.workspace }}"

  build-uipath-nuget-package:
    needs: cleaner
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Download and Setup UiPath CLI (uipath.cli.exe direct download)
        shell: pwsh
        run: |
          # !! IMPORTANT: This URL needs to be updated to a currently valid UiPath CLI download !!
          # The version 23.4.1 was giving a 404. You need to find a working version from UiPath.
          # Example (YOU MUST VERIFY THIS VERSION IS AVAILABLE):
          $cliDownloadUrl = "https://download.uipath.com/versions/23.10.8/UiPathStudioCli.zip" 
          # Or a newer version like 2024.4.x if available
          
          $cliZipPath = "${{ github.workspace }}\UiPathStudioCli.zip"
          $cliExtractDir = "${{ github.workspace }}\uipathcli"
          $cliExePath = Join-Path $cliExtractDir "uipath.cli.exe" # This is the expected executable name inside the zip
          
          Write-Host "Creating CLI extraction directory: $cliExtractDir"
          New-Item -ItemType Directory -Path $cliExtractDir -Force | Out-Null
          
          Write-Host "Attempting to download UiPath CLI from: $cliDownloadUrl"
          try {
              Invoke-WebRequest -Uri $cliDownloadUrl -OutFile $cliZipPath -UseBasicParsing -TimeoutSec 300
              Write-Host "Successfully downloaded UiPath CLI to $cliZipPath"
          } catch {
              # Corrected syntax using string concatenation for Write-Error
              Write-Error ("Failed to download UiPath CLI from " + $cliDownloadUrl + ": " + $_.Exception.Message)
              exit 1
          }
          
          Write-Host "Extracting UiPath CLI to: $cliExtractDir"
