name: Development CI/CD

on:
  push:
    branches:
      - develop # This workflow runs when code is pushed to the 'develop' branch

env:
  PROJECT_NAME: Addition_of_2_Numbers                       
  PROJECT_FOLDER: .
  ORCH_URL: https://cloud.uipath.com/noviggptduln/DefaultTenant
  ORCH_TENANT: ${{ secrets.ORCH_TENANT }}
  ORCH_CLIENT_ID: ${{ secrets.ORCH_CLIENT_ID }}
  ORCH_CLIENT_SECRET: ${{ secrets.ORCH_CLIENT_SECRET }}
  ORCH_DEV_FOLDER_PATH: Shared

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout Your Repository Code
        uses: actions/checkout@v4

      - name: Clone UiPath DevOps Scripts
        uses: actions/checkout@v4
        with:
          repository: UiPath-Services/UiPath-DevOps-Scripts
          path: devops-scripts

      - name: Verify Cloned Scripts Content # Keep this step for now, it's very useful for debugging!
        shell: pwsh
        run: |
          Write-Host "Listing contents of devops-scripts folder:"
          Get-ChildItem -Path "${{ github.workspace }}\devops-scripts" -Recurse | Select-Object FullName, Name
          Write-Host "Attempting to locate Invoke-UiPathDevOps.ps1:"
          Test-Path "${{ github.workspace }}\devops-scripts\scripts\Invoke-UiPathDevOps.ps1" # Corrected path for testing
          Test-Path "${{ github.workspace }}\devops-scripts\scripts\Shared" # Corrected path for testing

      - name: Install PowerShell Modules (Required by UiPath-DevOps-Scripts)
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck -AllowClobber
          Install-Module -Name CredentialManager -Force -SkipPublisherCheck -AllowClobber

      - name: Build UiPath NuGet Package and Publish to Orchestrator Development Folder
        shell: pwsh
        run: |
          # CORRECTED PATH HERE: Added 'scripts\' subfolder
          ./devops-scripts/scripts/Invoke-UiPathDevOps.ps1 `
            -ProjectFilePath "${{ github.workspace }}\${{ env.PROJECT_FOLDER }}\project.json" `
            -OrchestratorUrl "${{ env.ORCH_URL }}" `
            -TenantName "${{ env.ORCH_TENANT }}" `
            -OrchestratorClientId "${{ secrets.ORCH_CLIENT_ID }}" `
            -OrchestratorClientSecret "${{ secrets.ORCH_CLIENT_SECRET }}" `
            -OrchestratorFolderPath "${{ env.ORCH_DEV_FOLDER_PATH }}" `
            -PublishType "Orchestrator" `
            -LogActivity "true" `
            -PackageVersion "auto" `
            -AllowOrchestratorAuthentication

      - name: Upload UiPath Artifact (NuGet package)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}.nupkg
          path: "${{ github.workspace }}/package/${{ env.PROJECT_NAME }}.*.nupkg"

  test-published-package:
    needs: build-and-publish
    runs-on: windows-latest

    steps:
      - name: Checkout Your Repository Code (needed for project.json)
        uses: actions/checkout@v4

      - name: Clone UiPath DevOps Scripts (for testing commands)
        uses: actions/checkout@v4
        with:
          repository: UiPath-Services/UiPath-DevOps-Scripts
          path: devops-scripts

      - name: Install PowerShell Modules (for testing scripts)
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck -AllowClobber
          Install-Module -Name CredentialManager -Force -SkipPublisherCheck -AllowClobber

      - name: Run Tests on Published Package in Orchestrator
        shell: pwsh
        run: |
          # CORRECTED PATH HERE: Added 'scripts\' subfolder
          ./devops-scripts/scripts/Invoke-UiPathDevOps.ps1 `
            -ProjectFilePath "${{ github.workspace }}\${{ env.PROJECT_FOLDER }}\project.json" `
            -OrchestratorUrl "${{ env.ORCH_URL }}" `
            -TenantName "${{ env.ORCH_TENANT }}" `
            -OrchestratorClientId "${{ secrets.ORCH_CLIENT_ID }}" `
            -OrchestratorClientSecret "${{ secrets.ORCH_CLIENT_SECRET }}" `
            -OrchestratorFolderPath "${{ env.ORCH_DEV_FOLDER_PATH }}" `
            -ProcessName "${{ env.PROJECT_NAME }}" `
            -RunTestCases "true" `
            -LogActivity "true" `
            -AllowOrchestratorAuthentication
