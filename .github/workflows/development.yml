name: UiPath CI/CD Workflow

on:
  push:
    branches:
      - develop # Trigger on pushes to the develop branch

jobs:
  deploy_package: # Renamed job to reflect its primary purpose
    runs-on: windows-latest # Use a Windows runner

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up PowerShell environment
      shell: pwsh
      run: |
        Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
        Write-Host "Current working directory: $(Get-Location)"
        Write-Host "Listing contents of 'scripts' directory:"
        Get-ChildItem -Path ".\scripts" -Recurse -Force | Format-Table -AutoSize

    - name: Download and Setup UiPath CLI (uipath.exe)
      shell: pwsh
      env:
        UIPATH_CLI_FULL_PATH: ''
        UIPATH_CLI_DIR: ''
      run: |
        Write-Host "Attempting to execute DownloadUiPathCli.ps1..."
        Get-Content ".\scripts\DownloadUiPathCli.ps1" | ForEach-Object { Write-Host "  $_" }
        Write-Host "--------------------------------------------------"
        .\scripts\DownloadUiPathCli.ps1 -WorkspacePath "${{ github.workspace }}"

    - name: Verify UiPath CLI Contents and Version (Deployment Job)
      shell: pwsh
      run: |
        Write-Host "--- Verifying UiPath CLI Setup ---"
        $cli_full_path = "${{ env.UIPATH_CLI_FULL_PATH }}"
        $cli_dir = "${{ env.UIPATH_CLI_DIR }}"
        
        if ([string]::IsNullOrEmpty($cli_full_path)) {
            Write-Error "ERROR: UIPATH_CLI_FULL_PATH environment variable was not set. Cannot verify CLI."
            exit 1
        }
        if (-not (Test-Path $cli_full_path -PathType Leaf)) {
            Write-Error "UiPath CLI executable '$cli_full_path' not found."
            Get-ChildItem -Path $cli_dir -Recurse -Force | Format-Table -AutoSize
            exit 1
        }
        
        Write-Host "UiPath CLI executable found at: $cli_full_path"
        $fileInfo = Get-Item $cli_full_path
        Write-Host "File Size: $($fileInfo.Length) bytes"
        Write-Host "Last Write Time: $($fileInfo.LastWriteTime)"
        
        $expectedMinSize = 19000000 
        $expectedMaxSize = 21000000 
        
        if ($fileInfo.Length -lt $expectedMinSize -or $fileInfo.Length -gt $expectedMaxSize) {
            Write-Error "CRITICAL ERROR: UiPath CLI executable size is unexpected. Failing this step."
            exit 1
        } else {
            Write-Host "UiPath CLI executable size is within expected range. ($($fileInfo.Length) bytes)"
        }
        
        Write-Host "Running '$cli_full_path --help' to check commands..."
        $help_output = & "$cli_full_path" --help 2>&1 | Out-String
        Write-Host $help_output
        
        if ($help_output -notlike "*orchestrator*") {
            Write-Error "ERROR: The 'orchestrator' command is not available in this UiPath CLI version. Cannot deploy."
            exit 1
        }
        
        Write-Host "Attempting to get UiPath CLI version..."
        $versionFound = $false
        try {
            $rawOutput = & "$cli_full_path" 2>&1 | Out-String -ErrorAction SilentlyContinue
            if ($rawOutput -match "version (\d+\.\d+\.\d+)") { 
                Write-Host "UiPath CLI Version (from raw output): $($Matches[1])"
                $versionFound = $true
            } elseif ($rawOutput -match "UiPath Command-Line Interface (\d+\.\d+\.\d+)") { 
                 Write-Host "UiPath CLI Version (from raw output): $($Matches[1])"
                 $versionFound = $true
            } else {
                Write-Host "Info: Raw '$cli_full_path' output did not contain clear version info."
            }

            if (-not $versionFound) {
                Write-Host "Trying '$cli_full_path identity --version''..."
                try {
                    $identityVersionOutput = & "$cli_full_path" identity --version 2>&1 | Out-String -ErrorAction SilentlyContinue
                    if ($identityVersionOutput -match "version (\d+\.\d+\.\d+)") {
                        Write-Host "UiPath CLI Version (from 'identity --version'): $($Matches[1])"
                        $versionFound = $true
                    } else {
                        Write-Host "Info: '$cli_full_path identity --version' did not produce a clear version string."
                        Write-Host "Output: $identityVersionOutput"
                    }
                } catch {
                    Write-Host "Warning: '$cli_full_path identity --version' failed or is not supported. Error: $($_.Exception.Message)"
                }
            }
        }
        catch {
            Write-Host "Warning:
