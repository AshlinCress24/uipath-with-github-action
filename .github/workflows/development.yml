name: Development workflow

on:
  push:
    branches:
      - develop

# Here the environment variables are declared in workflow level
env:
  PROJECT_NAME: Addition_of_2_Numbers # <--- IMPORTANT: Change this to the exact name of your UiPath project
  PROJECT_FOLDER: . # Adjust if your project.json is in a subfolder relative to the repo root
  ORCH_URL: https://cloud.uipath.com
  ORCH_TENANT: ${{ secrets.ORCH_TENANT }}
  ORCH_CLIENT_ID: ${{ secrets.ORCH_CLIENT_ID }}
  ORCH_CLIENT_SECRET: ${{ secrets.ORCH_CLIENT_SECRET }}
  ORCH_DEV_FOLDER_PATH: Shared # <--- IMPORTANT: Change this if your Development Orchestrator Folder is NOT "Shared"
  ORCH_ORGANIZATION_NAME: ${{ secrets.ORCH_ORGANIZATION_NAME }}

jobs:
  print-details:
    runs-on: ubuntu-latest
    steps:
      - name: echo-default-env-variables
        run: |
          echo "Home: ${HOME}"
          echo "GITHUB_WORKFLOW: ${GITHUB_WORKFLOW}"
          echo "GITHUB_ACTIONS: ${GITHUB_ACTIONS}"
          echo "GITHUB_ACTOR: ${GITHUB_ACTOR}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "GITHUB_EVENT_NAME: ${GITHUB_EVENT_NAME}"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "GITHUB_REF: ${GITHUB_REF}"

  cleaner:
    runs-on: ubuntu-latest
    steps:
      - name: Runner workspace path
        run: |
          echo "Cleaning up previous run"
          rm -rf "${{ github.workspace }}"

  build-uipath-nuget-package:
    needs: cleaner
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Setup UiPath CLI
        uses: UiPath/setup-uipath-cli@v1 # Use the latest version

      - name: Build Nuget Package
        shell: pwsh
        run: |
          # The UiPathPack.ps1 script expects project.json path and destination folder
          # Assuming project.json is at the root or within the specified PROJECT_FOLDER
          # And 'package' folder will be created inside GITHUB_WORKSPACE
          ${{ github.workspace }}\scripts\UiPathPack.ps1 ${{ github.workspace }}\project.json -destination_folder ${{ github.workspace }}\package

      - name: Upload UiPath Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            package/*.* # This should include your .nupkg file
            scripts/*.ps1 # Include scripts for subsequent steps

  publish-uipath-nuget-package:
    needs: build-uipath-nuget-package
    runs-on: windows-latest
    steps:
      - name: Download UiPath Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Artifacts
      
      - name: Setup UiPath CLI
        uses: UiPath/setup-uipath-cli@v1 # Ensure CLI is available for the PowerShell script

      - name: Publish Nuget Package to DEV
        shell: pwsh
        run: |
          # Ensure your UiPathDeploy.ps1 expects these parameter names
          ${{ github.workspace }}\scripts\UiPathDeploy.ps1 `
          -packages_path "${{ github.workspace }}\package" ` # Pass the folder containing the .nupkg
          -orchestrator_url "${{ env.ORCH_URL }}" `
          -organization_name "${{ env.ORCH_ORGANIZATION_NAME }}" `
          -orchestrator_tenant "${{ env.ORCH_TENANT }}" `
          -client_id "${{ env.ORCH_CLIENT_ID }}" `
          -client_secret "${{ env.ORCH_CLIENT_SECRET }}" `
          -folder_organization_unit "${{ env.ORCH_DEV_FOLDER_PATH }}"

  # Create Pull Request for Merge & Review
  create-pull-request:
    # This job must now depend on 'publish-uipath-nuget-package'
    needs: publish-uipath-nuget-package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2
      - name: pull-request
        uses: repo-sync/pull-request@v2
        with:
          destination_branch: "master" # Adjust if your main branch is named something else (e.g., "main")
          github_token: ${{ secrets.GITHUB_TOKEN }} # GITHUB_TOKEN is usually auto-generated with sufficient permissions
          pr_label: "feature, automated pr"
          pr_title: "Pull Request From Github Action"
