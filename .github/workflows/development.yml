name: Development workflow

on:
  push:
    branches:
      - develop

# Here the environment variables are declared in workflow level
env:
  PROJECT_NAME: Addition_of_2_Numbers # !! IMPORTANT: Update this to your exact UiPath project name !!
  PROJECT_FOLDER: . # Adjust if your project.json is in a subfolder relative to the repo root (e.g., 'MyRPAProject')
  ORCH_URL: https://cloud.uipath.com # Typically this is correct for Cloud Orchestrator
  ORCH_TENANT: ${{ secrets.ORCH_TENANT }}
  ORCH_CLIENT_ID: ${{ secrets.ORCH_CLIENT_ID }}
  ORCH_CLIENT_SECRET: ${{ secrets.ORCH_CLIENT_SECRET }}
  ORCH_DEV_FOLDER_PATH: Shared # !! IMPORTANT: Change this if your Development Orchestrator Folder is NOT "Shared" !!
  ORCH_ORGANIZATION_NAME: ${{ secrets.ORCH_ORGANIZATION_NAME }} # Required for cloud.uipath.com login

jobs:
  print-details:
    runs-on: ubuntu-latest
    steps:
      - name: echo-default-env-variables
        run: |
          echo "Home: ${HOME}"
          echo "GITHUB_WORKFLOW: ${GITHUB_WORKFLOW}"
          echo "GITHUB_ACTIONS: ${GITHUB_ACTIONS}"
          echo "GITHUB_ACTOR: ${GITHUB_ACTOR}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "GITHUB_EVENT_NAME: ${GITHUB_EVENT_NAME}"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "GITHUB_REF: ${GITHUB_REF}"

  cleaner:
    runs-on: ubuntu-latest
    steps:
      - name: Runner workspace path
        run: |
          echo "Cleaning up previous run"
          rm -rf "${{ github.workspace }}"

  build-uipath-nuget-package:
    needs: cleaner
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Manually Setup UiPath CLI
        shell: pwsh
        run: |
          $cliDir = "${{ github.workspace }}\uipathcli"
          $installPath = $cliDir
          
          # --- NEW CLI INSTALLATION METHOD: Download UiPath.CLI from MyGet feed ---
          $nugetExeUrl = "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe"
          $nugetExePath = Join-Path $installPath "nuget.exe"
          $cliPackageId = "UiPath.CLI" # FIX: Changed to UiPath.CLI (without .Windows)
          $cliPackageVersion = "23.4.1" # FIX: This version is known to contain uipcli.exe (v1.x)
          # FIX: Reverting to MyGet feed, which lists the package
          $uipathNugetSource = "https://www.myget.org/F/uipath/api/v3/index.json" 

          Write-Host "Creating CLI directory: $installPath"
          New-Item -ItemType Directory -Path $installPath -Force | Out-Null

          Write-Host "Downloading nuget.exe from $nugetExeUrl to $nugetExePath"
          Invoke-WebRequest -Uri $nugetExeUrl -OutFile $nugetExePath

          Write-Host "Downloading UiPath CLI package '$cliPackageId' v$cliPackageVersion from UiPath's MyGet NuGet feed"
          # FIX: Added --verbosity Detailed for better debugging of NuGet issues
          & $nugetExePath install $cliPackageId -Version $cliPackageVersion -OutputDirectory $installPath -Source $uipathNugetSource -NonInteractive --verbosity Detailed

          # The uipcli.exe will be inside a tools folder within the extracted NuGet package
          $extractedCliDir = Join-Path $installPath "$cliPackageId.$cliPackageVersion\tools"
          $cliExePath = Join-Path $extractedCliDir "uipcli.exe"

          Write-Host "Adding UiPath CLI tools directory to PATH: $extractedCliDir"
          Add-Content -Path $env:GITHUB_PATH -Value $extractedCliDir

          Write-Host "Verifying uipcli.exe presence and version..."
          if (Test-Path $cliExePath) {
              Write-Host "uipcli.exe found at: $cliExePath"
              & $cliExePath --version
              & $cliExePath --help
          } else {
              Write-Error "uipcli.exe not found after extraction! Expected at: $cliExePath"
              exit 1
          }
      
      - name: Verify Extracted CLI Content and Commands (Diagnostic)
        shell: pwsh
        run: |
          $cliDir = "$env:GITHUB_WORKSPACE\uipathcli"
          # FIX: Corrected path to reflect UiPath.CLI package name and version
          $cliExePath = Join-Path $cliDir "UiPath.CLI.23.4.1\tools\uipcli.exe" 
          
          Write-Host "Listing contents of ${cliDir}:"
          Get-ChildItem -Path $cliDir -Recurse -Force | Format-Table -AutoSize
          
          if (Test-Path $cliExePath) {
              Write-Host "${cliExePath} exists!"
              Write-Host "Running '${cliExePath} --version':"
              & $cliExePath --version
              Write-Host "Running '${cliExePath} --help':"
              & $cliExePath --help
          } else {
              Write-Error "${cliExePath} NOT FOUND! This should not happen at this stage."
              exit 1
          }

      - name: Build Nuget Package
        shell: pwsh
        run: |
          # This script uses the uipcli.exe located in the PATH
          "${{ github.workspace }}\scripts\UiPathPack.ps1" `
          -project_path "${{ github.workspace }}\${{ env.PROJECT_FOLDER }}\${{ env.PROJECT_NAME }}\project.json" `
          -output_path "${{ github.workspace }}\package"

      - name: Upload UiPath Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            package/*.*
            scripts/*.ps1

  publish-uipath-nuget-package:
    needs: build-uipath-nuget-package
    runs-on: windows-latest
    steps:
      - name: Download UiPath Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Artifacts
      
      - name: Manually Setup UiPath CLI
        shell: pwsh
        run: |
          $cliDir = "$env:GITHUB_WORKSPACE\uipathcli" 
          $installPath = $cliDir 
          
          # --- NEW CLI INSTALLATION METHOD: Download UiPath.CLI from MyGet feed ---
          $nugetExeUrl = "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe"
          $nugetExePath = Join-Path $installPath "nuget.exe"
          $cliPackageId = "UiPath.CLI" 
          $cliPackageVersion = "23.4.1" 
          # FIX: Reverting to MyGet feed (which lists the package)
          $uipathNugetSource = "https://www.myget.org/F/uipath/api/v3/index.json" 

          Write-Host "Creating CLI directory: $installPath"
          New-Item -ItemType Directory -Path $installPath -Force | Out-Null

          Write-Host "Downloading nuget.exe from $nugetExeUrl to $nugetExePath"
          Invoke-WebRequest -Uri $nugetExeUrl -OutFile $nugetExePath

          Write-Host "Downloading UiPath CLI package '$cliPackageId' v$cliPackageVersion from UiPath's MyGet NuGet feed"
          # FIX: Added --verbosity Detailed for better debugging of NuGet issues
          & $nugetExePath install $cliPackageId -Version $cliPackageVersion -OutputDirectory $installPath -Source $uipathNugetSource -NonInteractive --verbosity Detailed

          # The uipcli.exe will be inside a tools folder within the extracted NuGet package
          $extractedCliDir = Join-Path $installPath "$cliPackageId.$cliPackageVersion\tools"
          $cliExePath = Join-Path $extractedCliDir "uipcli.exe" 

          Write-Host "Adding UiPath CLI tools directory to PATH: $extractedCliDir"
          Add-Content -Path $env:GITHUB_PATH -Value $extractedCliDir

      - name: Verify Extracted CLI Content and Commands (Publish Job - Diagnostic)
        shell: pwsh
        run: |
          $cliDir = "$env:GITHUB_WORKSPACE\uipathcli"
          $cliExePath = Join-Path $cliDir "UiPath.CLI.23.4.1\tools\uipcli.exe" # Correct path after NuGet extraction
          
          Write-Host "Listing contents of ${cliDir}:"
          Get-ChildItem -Path $cliDir -Recurse -Force | Format-Table -AutoSize
          
          if (Test-Path $cliExePath) {
              Write-Host "${cliExePath} exists!"
              Write-Host "Running '${cliExePath} --version':"
              & $cliExePath --version
              Write-Host "Running '${cliExePath} --help':"
              & $cliExePath --help
          } else {
              Write-Error "${cliExePath} NOT FOUND! This should not happen at this stage."
              exit 1
          }

      - name: Publish Nuget Package to DEV
        shell: pwsh
        run: |
          # This script uses the uipcli.exe located in the PATH
          "${{ github.workspace }}\scripts\UiPathDeploy.ps1" `
          -packages_path "${{ github.workspace }}\package" `
          -orchestrator_url "${{ env.ORCH_URL }}" `
          -organization_name "${{ env.ORCH_ORGANIZATION_NAME }}" `
          -orchestrator_tenant "${{ env.ORCH_TENANT }}" `
          -client_id "${{ env.ORCH_CLIENT_ID }}" `
          -client_secret "${{ env.ORCH_CLIENT_SECRET }}" `
          -folder_organization_unit "${{ env.ORCH_DEV_FOLDER_PATH }}"

  create-pull-request:
    needs: publish-uipath-nuget-package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2
      - name: pull-request
        uses: repo-sync/pull-request@v2
        with:
          destination_branch: "master"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_label: "feature, automated pr"
          pr_title: "Pull Request From Github Action"
