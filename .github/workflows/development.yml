name: Development CI/CD

on:
  push:
    branches:
      - develop # This workflow runs when code is pushed to the 'develop' branch

env:
  PROJECT_NAME: Addition_of_2_Numbers                       
  PROJECT_FOLDER: .
  ORCH_URL: https://cloud.uipath.com/noviggptduln/DefaultTenant
  ORCH_TENANT: ${{ secrets.ORCH_TENANT }}
  ORCH_CLIENT_ID: ${{ secrets.ORCH_CLIENT_ID }}
  ORCH_CLIENT_SECRET: ${{ secrets.ORCH_CLIENT_SECRET }}
  ORCH_DEV_FOLDER_PATH: Shared

jobs:
  # Job to build the Nuget package and publish it to Orchestrator
  build-and-publish:
    runs-on: windows-latest # Windows runners are recommended for UiPath automation

    steps:
      - name: Checkout Your Repository Code
        # Clones your own repository (containing your UiPath project code)
        uses: actions/checkout@v4

      - name: Build UiPath NuGet Package
        # IMPORTANT: Changed action version to @v2
        uses: uipath/actions/pack-project-to-nuget-package@v2
        with:
          project-path: ${{ github.workspace }}\${{ env.PROJECT_FOLDER }}\project.json # Path to your project.json
          output-path: ${{ github.workspace }}\package # Folder where the .nupkg will be created
          package-version: auto # Automatically increments package version

      - name: Upload UiPath Artifact (NuGet package)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}.nupkg
          path: "${{ github.workspace }}/package/${{ env.PROJECT_NAME }}.*.nupkg" # Path to the generated package

      - name: Deploy Nuget Package to Orchestrator Development Folder
        # IMPORTANT: Changed action version to @v2
        uses: uipath/actions/deploy-package-to-orchestrator@v2
        with:
          orchestrator-url: ${{ env.ORCH_URL }}
          tenant-name: ${{ env.ORCH_TENANT }}
          client-id: ${{ secrets.ORCH_CLIENT_ID }} # Using GitHub Secret
          client-secret: ${{ secrets.ORCH_CLIENT_SECRET }} # Using GitHub Secret
          orchestrator-folder-path: ${{ env.ORCH_DEV_FOLDER_PATH }} # Orchestrator folder for deployment
          package-path: ${{ github.workspace }}\package # Folder where the .nupkg is located
          process-name: ${{ env.PROJECT_NAME }} # Name of the process to update/create (usually same as project name)
          # Optional: process-type: Attended / Unattended (default is Unattended)
