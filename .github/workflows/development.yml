name: UiPath CI/CD Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up PowerShell Core
        uses: actions/setup-pwsh@v2

      - name: Download UiPath CLI
        shell: pwsh
        run: |
          $Workspace = "${{ github.workspace }}"
          pwsh ./scripts/DownloadUiPathCli.ps1 -WorkspacePath $Workspace

      - name: Pack UiPath Project
        shell: pwsh
        run: |
          pwsh ./scripts/UiPathPack.ps1 `
            -project_path "${{ github.workspace }}/project.json" `
            -output_path "${{ github.workspace }}/output_packages"

      - name: Upload UiPath Package as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uipath-package
          path: ${{ github.workspace }}/output_packages/*.nupkg

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up PowerShell Core
        uses: actions/setup-pwsh@v2

      - name: Download UiPath CLI
        shell: pwsh
        run: |
          $Workspace = "${{ github.workspace }}"
          pwsh ./scripts/DownloadUiPathCli.ps1 -WorkspacePath $Workspace

      - name: Download UiPath Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: uipath-package
          path: ${{ github.workspace }}/downloaded_packages

      - name: Deploy UiPath Package to Orchestrator
        shell: pwsh
        env:
          ORCH_CLIENT_ID: ${{ secrets.ORCH_CLIENT_ID }}
          ORCH_CLIENT_SECRET: ${{ secrets.ORCH_CLIENT_SECRET }}
          ORCH_ORGANIZATION_NAME: ${{ secrets.ORCH_ORGANIZATION_NAME }}
          ORCH_TENANT: ${{ secrets.ORCH_TENANT }}
          ORCH_URL: ${{ secrets.ORCH_URL }}
        run: |
          pwsh ./scripts/UiPathDeploy.ps1 `
            -packages_path "${{ github.workspace }}/downloaded_packages" `
