name: Development workflow

on:
  push:
    branches:
      - develop

# Here the environment variables are declared in workflow level
env:
  PROJECT_NAME: Addition_of_2_Numbers # !! IMPORTANT: Update this to your exact UiPath project name !!
  PROJECT_FOLDER: . # Adjust if your project.json is in a subfolder relative to the repo root (e.g., 'MyRPAProject')
  ORCH_URL: https://cloud.uipath.com # Typically this is correct for Cloud Orchestrator
  ORCH_TENANT: ${{ secrets.ORCH_TENANT }}
  ORCH_CLIENT_ID: ${{ secrets.ORCH_CLIENT_ID }}
  ORCH_CLIENT_SECRET: ${{ secrets.ORCH_CLIENT_SECRET }}
  ORCH_DEV_FOLDER_PATH: Shared # !! IMPORTANT: Change this if your Development Orchestrator Folder is NOT "Shared" !!
  ORCH_ORGANIZATION_NAME: ${{ secrets.ORCH_ORGANIZATION_NAME }} # Required for cloud.uipath.com login

jobs:
  print-details:
    runs-on: ubuntu-latest
    steps:
      - name: echo-default-env-variables
        run: |
          echo "Home: ${HOME}"
          echo "GITHUB_WORKFLOW: ${GITHUB_WORKFLOW}"
          echo "GITHUB_ACTIONS: ${GITHUB_ACTIONS}"
          echo "GITHUB_ACTOR: ${GITHUB_ACTOR}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "GITHUB_EVENT_NAME: ${GITHUB_EVENT_NAME}"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "GITHUB_REF: ${GITHUB_REF}"

  cleaner:
    runs-on: ubuntu-latest
    steps:
      - name: Runner workspace path
        run: |
          echo "Cleaning up previous run"
          rm -rf "${{ github.workspace }}"

  build-uipath-nuget-package:
    needs: cleaner
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Download and Setup UiPath CLI (uipath.cli.exe direct download)
        shell: pwsh
        run: |
          $cliDownloadUrl = "https://download.uipath.com/versions/23.4.1/UiPathStudioCli.zip"
          $cliZipPath = "${{ github.workspace }}\UiPathStudioCli.zip"
          $cliExtractDir = "${{ github.workspace }}\uipathcli"
          $cliExePath = Join-Path $cliExtractDir "uipath.cli.exe" # This is the expected executable name inside the zip
          
          Write-Host "Creating CLI extraction directory: $cliExtractDir"
          New-Item -ItemType Directory -Path $cliExtractDir -Force | Out-Null
          
          Write-Host "Attempting to download UiPath CLI from: $cliDownloadUrl"
          try {
              Invoke-WebRequest -Uri $cliDownloadUrl -OutFile $cliZipPath -UseBasicParsing -TimeoutSec 300
              Write-Host "Successfully downloaded UiPath CLI to $cliZipPath"
          } catch {
              # Corrected syntax using string concatenation for Write-Error
              Write-Error ("Failed to download UiPath CLI from " + $cliDownloadUrl + ": " + $_.Exception.Message)
              exit 1
          }
          
          Write-Host "Extracting UiPath CLI to: $cliExtractDir"
          try {
              Expand-Archive -Path $cliZipPath -DestinationPath $cliExtractDir -Force
              Write-Host "Successfully extracted UiPath CLI to $cliExtractDir"
          } catch {
              # Corrected syntax using string concatenation for Write-Error
              Write-Error ("Failed to extract UiPath CLI from " + $cliZipPath + ": " + $_.Exception.Message)
              exit 1
          }
          
          Write-Host "Adding UiPath CLI directory to PATH: $cliExtractDir"
          Add-Content -Path $env:GITHUB_PATH -Value $cliExtractDir
          
          Write-Host "Verifying uipath.cli.exe presence and version..."
          if (Test-Path $cliExePath) {
              Write-Host "uipath.cli.exe found at: $cliExePath"
              & $cliExePath --version # Verify version
              & $cliExePath help # Use 'help' for v2 CLI
          } else {
              Write-Error "uipath.cli.exe not found after extraction! Expected at: $cliExePath"
              # Corrected syntax for Write-Host of CLI extraction directory
              Write-Host "Listing contents of ${cliExtractDir}:" 
              Get-ChildItem -Path $cliExtractDir -Recurse -Force | Format-Table -AutoSize
              exit 1
          }
          # Set the CLI executable name for subsequent steps (always uipath.cli.exe now)
          echo "UIPATH_CLI_EXECUTABLE_NAME=uipath.cli.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Nuget Package
        shell: pwsh
        run: |
          "${{ github.workspace }}\scripts\UiPathPack.ps1" `
          -project_path "${{ github.workspace }}\${{ env.PROJECT_FOLDER }}\${{ env.PROJECT_NAME }}\project.json" `
          -output_path "${{ github.workspace }}\package" `
          -cli_executable_name "${{ env.UIPATH_CLI_EXECUTABLE_NAME }}"

      - name: Upload UiPath Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            package/*.*
            scripts/*.ps1

  publish-uipath-nuget-package:
    needs: build-uipath-nuget-package
    runs-on: windows-latest
    steps:
      - name: Download UiPath Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Artifacts
      
      - name: Download and Setup UiPath CLI (for Publish Job - uipath.cli.exe direct download)
        shell: pwsh
        run: |
          $cliDownloadUrl = "https://download.uipath.com/versions/23.4.1/UiPathStudioCli.zip"
          $cliZipPath = "$env:GITHUB_WORKSPACE\UiPathStudioCli.zip"
          $cliExtractDir = "$env:GITHUB_WORKSPACE\uipathcli"
          $cliExePath = Join-Path $cliExtractDir "uipath.cli.exe"

          Write-Host "Creating CLI extraction directory: $cliExtractDir"
          New-Item -ItemType Directory -Path $cliExtractDir -Force | Out-Null

          Write-Host "Attempting to download UiPath CLI from: $cliDownloadUrl"
          try {
              Invoke-WebRequest -Uri $cliDownloadUrl -OutFile $cliZipPath -UseBasicParsing -TimeoutSec 300
              Write-Host "Successfully downloaded UiPath CLI to $cliZipPath"
          } catch {
              # Corrected syntax using string concatenation for Write-Error
              Write-Error ("Failed to download UiPath CLI from " + $cliDownloadUrl + ": " + $_.Exception.Message)
              exit 1
          }

          Write-Host "Extracting UiPath CLI to: $cliExtractDir"
          try {
              Expand-Archive -Path $cliZipPath -DestinationPath $cliExtractDir -Force
              Write-Host "Successfully extracted UiPath CLI to $cliExtractDir"
          } catch {
              # Corrected syntax using string concatenation for Write-Error
              Write-Error ("Failed to extract UiPath CLI from " + $cliZipPath + ": " + $_.Exception.Message)
              exit 1
          }

          Write-Host "Adding UiPath CLI directory to PATH: $cliExtractDir"
          Add-Content -Path $env:GITHUB_PATH -Value $cliExtractDir

          Write-Host "Verifying uipath.cli.exe presence and version..."
          if (Test-Path $cliExePath) {
              Write-Host "uipath.cli.exe found at: $cliExePath"
              & $cliExePath --version
              & $cliExePath help
          } else {
              Write-Error "uipath.cli.exe not found after extraction! Expected at: $cliExePath"
              # Corrected syntax for Write-Host of CLI extraction directory
              Write-Host "Listing contents of ${cliExtractDir}:"
              Get-ChildItem -Path $cliExtractDir -Recurse -Force | Format-Table -AutoSize
              exit 1
          }
          echo "UIPATH_CLI_EXECUTABLE_NAME=uipath.cli.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish Nuget Package to DEV
        shell: pwsh
        run: |
          "${{ github.workspace }}\scripts\UiPathDeploy.ps1" `
          -packages_path "${{ github.workspace }}\package" `
          -orchestrator_url "${{ env.ORCH_URL }}" `
          -organization_name "${{ env.ORCH_ORGANIZATION_NAME }}" `
          -orchestrator_tenant "${{ env.ORCH_TENANT }}" `
          -client_id "${{ env.ORCH_CLIENT_ID }}" `
          -client_secret "${{ env.ORCH_CLIENT_SECRET }}" `
          -folder_organization_unit "${{ env.ORCH_DEV_FOLDER_PATH }}" `
          -cli_executable_name "${{ env.UIPATH_CLI_EXECUTABLE_NAME }}"

  create-pull-request:
    needs: publish-uipath-nuget-package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2
      - name: pull-request
        uses: repo-sync/pull-request@v2
        with:
          destination_branch: "master"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_label: "feature, automated pr"
          pr_title: "Pull Request From Github Action"
