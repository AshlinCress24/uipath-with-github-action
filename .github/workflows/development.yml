name: Development workflow

on:
  push:
    branches:
      - develop

# Here the environment variables are declared in workflow level
env:
  PROJECT_NAME: Addition_of_2_Numbers # !! IMPORTANT: Update this to your exact UiPath project name !!
  PROJECT_FOLDER: . # Adjust if your project.json is in a subfolder relative to the repo root (e.g., 'MyRPAProject')
  ORCH_URL: https://cloud.uipath.com # Typically this is correct for Cloud Orchestrator
  ORCH_TENANT: ${{ secrets.ORCH_TENANT }}
  ORCH_CLIENT_ID: ${{ secrets.ORCH_CLIENT_ID }}
  ORCH_CLIENT_SECRET: ${{ secrets.ORCH_CLIENT_SECRET }}
  ORCH_DEV_FOLDER_PATH: Shared # !! IMPORTANT: Change this if your Development Orchestrator Folder is NOT "Shared" !!
  ORCH_ORGANIZATION_NAME: ${{ secrets.ORCH_ORGANIZATION_NAME }} # Required for cloud.uipath.com login

jobs:
  print-details:
    runs-on: ubuntu-latest
    steps:
      - name: echo-default-env-variables
        run: |
          echo "Home: ${HOME}"
          echo "GITHUB_WORKFLOW: ${GITHUB_WORKFLOW}"
          echo "GITHUB_ACTIONS: ${GITHUB_ACTIONS}"
          echo "GITHUB_ACTOR: ${GITHUB_ACTOR}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "GITHUB_EVENT_NAME: ${GITHUB_EVENT_NAME}"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "GITHUB_REF: ${GITHUB_REF}"

  cleaner:
    runs-on: ubuntu-latest
    steps:
      - name: Runner workspace path
        run: |
          echo "Cleaning up previous run"
          rm -rf "${{ github.workspace }}"

  build-uipath-nuget-package:
    needs: cleaner
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Setup NuGet.exe
        shell: pwsh
        run: |
          # Download nuget.exe to a known location
          $nugetExePath = "${{ github.workspace }}\nuget.exe"
          Write-Host "Downloading nuget.exe to $nugetExePath"
          Invoke-WebRequest -Uri https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile $nugetExePath -UseBasicParsing
          if (-not (Test-Path $nugetExePath)) {
              Write-Error "Failed to download nuget.exe. Exiting."
              exit 1
          }
          Write-Host "nuget.exe downloaded successfully."
          # Add nuget.exe's directory to PATH so it can be called directly
          Add-Content -Path $env:GITHUB_PATH -Value "${{ github.workspace }}"

      - name: Install UiPath CLI (via UiPath.Automation.Cloud.Activities and nuget.exe)
        shell: pwsh
        run: |
          $cliInstallDir = "${{ github.workspace }}\uipathcli"
          $activitiesPackageId = "UiPath.Automation.Cloud.Activities" 
          $activitiesPackageVersion = "1.21.0" # This version is known to contain uipcli.exe
          $nugetFeed = "https://api.nuget.org/v3/index.json"

          Write-Host "Creating CLI installation directory: $cliInstallDir"
          New-Item -ItemType Directory -Path $cliInstallDir -Force | Out-Null

          Write-Host "Installing package '$activitiesPackageId' v$activitiesPackageVersion into $cliInstallDir using nuget.exe from $nugetFeed"
          # Use the nuget.exe that was added to PATH
          nuget install $activitiesPackageId -Version $activitiesPackageVersion -OutputDirectory $cliInstallDir -Source $nugetFeed -NoCache -ExcludeVersion
          # Note: -ExcludeVersion puts the package content directly in $cliInstallDir/$activitiesPackageId
          # Without -ExcludeVersion, it would be in $cliInstallDir/$activitiesPackageId.$activitiesPackageVersion

          # Expected path to uipcli.exe within the extracted package
          # Because of -ExcludeVersion, the path simplifies
          $extractedPackageRoot = Join-Path $cliInstallDir $activitiesPackageId # This is the directory created by nuget install
          $cliExePath = Join-Path $extractedPackageRoot "tools\uipcli.exe" 
          
          # The uipcli.exe will be inside a tools folder within the extracted NuGet package
          $extractedCliToolsDir = Join-Path $extractedPackageRoot "tools"
          
          Write-Host "Adding UiPath CLI tools directory to PATH: $extractedCliToolsDir"
          Add-Content -Path $env:GITHUB_PATH -Value $extractedCliToolsDir

          Write-Host "Verifying uipcli.exe presence and version..."
          if (Test-Path $cliExePath) {
              Write-Host "uipcli.exe found at: $cliExePath"
              & $cliExePath --version # Verify version
              & $cliExePath --help    # Verify help output
          } else {
              Write-Error "uipcli.exe not found after installation! Expected at: $cliExePath"
              Write-Host "Listing contents of ${cliInstallDir}:" 
              Get-ChildItem -Path $cliInstallDir -Recurse -Force | Format-Table -AutoSize
              exit 1
          }
      
      - name: Verify Extracted CLI Content and Commands (Diagnostic)
        shell: pwsh
        run: |
          # Note: The path below needs to be updated to reflect UiPath.Automation.Cloud.Activities and -ExcludeVersion
          $cliInstallDir = "$env:GITHUB_WORKSPACE\uipathcli"
          $activitiesPackageId = "UiPath.Automation.Cloud.Activities"
          $cliExePath = Join-Path $cliInstallDir "$activitiesPackageId\tools\uipcli.exe" 
          
          Write-Host "Listing contents of ${cliInstallDir}:"
          Get-ChildItem -Path $cliInstallDir -Recurse -Force | Format-Table -AutoSize
          
          if (Test-Path $cliExePath) {
              Write-Host "${cliExePath} exists!"
              Write-Host "Running '${cliExePath} --version':"
              & $cliExePath --version
              Write-Host "Running '${cliExePath} --help':"
              & $cliExePath --help
          } else {
              Write-Error "${cliExePath} NOT FOUND! This should not happen at this stage."
              exit 1
          }

      - name: Build Nuget Package
        shell: pwsh
        run: |
          # This script uses the uipcli.exe located in the PATH as well as explicitly.
          # The paths within the script are designed to find it.
          "${{ github.workspace }}\scripts\UiPathPack.ps1" `
          -project_path "${{ github.workspace }}\${{ env.PROJECT_FOLDER }}\${{ env.PROJECT_NAME }}\project.json" `
          -output_path "${{ github.workspace }}\package"

      - name: Upload UiPath Artifacts
        uses: actions/upload-artifact
