# .github/workflows/development.yml

name: Development workflow

on:
  push:
    branches:
      - develop

# Here the environment variables are declared in workflow level
env:
  PROJECT_NAME: Addition_of_2_Numbers # !! IMPORTANT: Update this to your exact UiPath project name !!
  PROJECT_FOLDER: . # Adjust if your project.json is in a subfolder relative to the repo root (e.g., 'MyRPAProject')
  ORCH_URL: https://cloud.uipath.com # Typically this is correct for Cloud Orchestrator
  ORCH_TENANT: ${{ secrets.ORCH_TENANT }}
  ORCH_CLIENT_ID: ${{ secrets.ORCH_CLIENT_ID }}
  ORCH_CLIENT_SECRET: ${{ secrets.ORCH_CLIENT_SECRET }}
  ORCH_DEV_FOLDER_PATH: Shared # !! IMPORTANT: Change this if your Development Orchestrator Folder is NOT "Shared" !!
  ORCH_ORGANIZATION_NAME: ${{ secrets.ORCH_ORGANIZATION_NAME }} # Required for cloud.uipath.com login

jobs:
  print-details:
    runs-on: ubuntu-latest
    steps:
      - name: echo-default-env-variables
        run: |
          echo "Home: ${HOME}"
          echo "GITHUB_WORKFLOW: ${GITHUB_WORKFLOW}"
          echo "GITHUB_ACTIONS: ${GITHUB_ACTIONS}"
          echo "GITHUB_ACTOR: ${GITHUB_ACTOR}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "GITHUB_EVENT_NAME: ${GITHUB_EVENT_NAME}"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "GITHUB_REF: ${GITHUB_REF}"

  cleaner:
    runs-on: ubuntu-latest
    steps:
      - name: Runner workspace path
        run: |
          echo "Cleaning up previous run"
          rm -rf "${{ github.workspace }}"

  build-uipath-nuget-package:
    needs: cleaner
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2 # Needed to access scripts folder

      - name: Download and Setup UiPath CLI
        run: |
          # Temporarily bypass execution policy for the session to ensure scripts can run
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          Write-Host "Current working directory: $(Get-Location)"
          Write-Host "Listing contents of 'scripts' directory:"
          Get-ChildItem -Path ".\scripts" -Recurse -Force | Format-Table -AutoSize
          Write-Host "Attempting to execute DownloadUiPathCli.ps1..."
          .\scripts\DownloadUiPathCli.ps1 -WorkspacePath "${{ github.workspace }}"

      - name: Verify UiPath CLI Contents and Version (Build Job)
        shell: pwsh
        run: |
          Write-Host "Listing contents of UiPath CLI directory:"
          Get-ChildItem -Path "${{ github.workspace }}\uipathcli" -Recurse -Force | Format-Table -AutoSize
          
          $cli_executable_name = $env:UIPATH_CLI_EXECUTABLE_NAME
          $cli_path = Get-Command $cli_executable_name -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          
          if ($cli_path) {
              Write-Host "Running '$cli_path --help' to check commands..."
              & $cli_path --help
              Write-Host "Running '$cli_path -v' to check version..."
              & $cli_path -v
          } else {
              Write-Error "UiPath CLI executable '$cli_executable_name' not found after download."
              exit 1
          }

      - name: Build Nuget Package
        shell: pwsh
        run: |
          # Temporarily bypass execution policy for the session
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\scripts\UiPathPack.ps1 `
          -project_path "${{ github.workspace }}/project.json" `
          -output_path "${{ github.workspace }}\package"

      - name: Upload UiPath Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            package/*.*
            scripts/*.ps1

  publish-uipath-nuget-package:
    needs: build-uipath-nuget-package
    runs-on: windows-latest
    steps:
      - name: Download UiPath Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Artifacts
          path: ${{ github.workspace }} # Download to workspace root
      
      - name: Check out repository code (for publish job to access scripts)
        uses: actions/checkout@v2 # Needed for this job to access scripts folder

      - name: Download and Setup UiPath CLI (for Publish Job)
        run: |
          # Temporarily bypass execution policy for the session
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          Write-Host "Current working directory: $(Get-Location)"
          Write-Host "Listing contents of 'scripts' directory:"
          Get-ChildItem -Path ".\scripts" -Recurse -Force | Format-Table -AutoSize
          Write-Host "Attempting to execute DownloadUiPathCli.ps1..."
          .\scripts\DownloadUiPathCli.ps1 -WorkspacePath "${{ github.workspace }}"

      - name: Verify UiPath CLI Contents and Version (Publish Job)
        shell: pwsh
        run: |
          Write-Host "Listing contents of UiPath CLI directory:"
          Get-ChildItem -Path "${{ github.workspace }}\uipathcli" -Recurse -Force | Format-Table -AutoSize
          
          $cli_executable_name = $env:UIPATH_CLI_EXECUTABLE_NAME
          $cli_path = Get-Command $cli_executable_name -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          
