name: UiPath CI/CD Pipeline

on:
  push:
    branches:
      - develop # Trigger on pushes to the develop branch
  pull_request: # Trigger on pull requests targeting develop
    branches:
      - develop

jobs:
  # Job 1: Build UiPath Project (Packs .nupkg)
  build:
    runs-on: windows-latest # Use a Windows runner for UiPath development

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up PowerShell environment
      shell: pwsh
      run: |
        # Ensure PowerShell Execution Policy allows scripts to run
        Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
        Write-Host "Current working directory: $(Get-Location)"

    - name: Download UiPathPack.ps1 Script
      shell: pwsh
      run: |
        $scriptsDir = Join-Path $env:TEMP "UiPathDevOpsScripts"
        New-Item -Path $scriptsDir -ItemType Directory -Force | Out-Null
        Invoke-WebRequest "https://github.com/UiPath-Services/UiPath-DevOps-Scripts/raw/main/scripts/UiPathPack.ps1" -OutFile (Join-Path $scriptsDir "UiPathPack.ps1")
        Write-Host "Downloaded UiPathPack.ps1 to $scriptsDir"
      env:
        SCRIPTS_DIR: ${{ runner.temp }}\UiPathDevOpsScripts # Define a temp directory for scripts

    - name: Pack UiPath Project into .nupkg
      shell: pwsh
      env:
        PROJECT_DIR: './' # Path to your UiPath project (folder containing project.json)
        OUTPUT_DIR: '${{ github.workspace }}/output_packages' # Where to save the nupkg
      run: |
        $packScriptPath = Join-Path $env:TEMP "UiPathDevOpsScripts" "UiPathPack.ps1"
        $projectDir = Convert-Path "${{ env.PROJECT_DIR }}"
        $outputDir = Convert-Path "${{ env.OUTPUT_DIR }}"

        New-Item -Path $outputDir -ItemType Directory -Force | Out-Null

        Write-Host "Packing UiPath project from '$projectDir'..."
        Write-Host "Output packages will be saved to '$outputDir'."

        # Execute UiPathPack.ps1
        # IMPORTANT: This assumes your UiPath project is at the root of the repository or at ${{ env.PROJECT_DIR }}
        # The script needs to find project.json
        & $packScriptPath -ProjectPath $projectDir -OutputFolder $outputDir -ContinueOnError $false -Verbose

        # List contents of output directory to confirm package creation
        Write-Host "Contents of output_packages directory:"
        Get-ChildItem -Path $outputDir -Recurse -Force | Format-Table -AutoSize
        
        $nupkgFiles = Get-ChildItem -Path $outputDir -Filter "*.nupkg"
        if ($nupkgFiles.Count -eq 0) {
            Write-Error "ERROR: No .nupkg file was generated by the pack step. Check project structure and UiPathPack.ps1 output."
            exit 1
        } else {
            Write-Host "Successfully generated UiPath package(s):"
            $nupkgFiles | Select-Object -ExpandProperty FullName | Write-Host
        }

    - name: Upload UiPath Package as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: uipath-package
        path: ${{ github.workspace }}/output_packages/*.nupkg # Upload all nupkg files

  # Job 2: Deploy UiPath Package to Orchestrator (Depends on successful build)
  deploy:
    runs-on: windows-latest
    needs: build # This job will only run after the 'build' job completes successfully

    steps:
    - name: Checkout Repository (for CLI scripts if needed, though CLI is downloaded)
      uses: actions/checkout@v4

    - name: Download UiPath CLI (uipath.exe)
      uses: Mikael-RnD/setup-uipath-cli@v2 # Using a pre-built action for easier setup
      with:
        platform-version: '2024.10' # Or a specific CLI version like '24.12.9111.31003'

    - name: Download UiPath Package Artifact
      uses: actions/download-artifact@v4
      with:
        name: uipath-package
        path: ${{ github.workspace }}/downloaded_packages # Download to a specific directory

    - name: Deploy UiPath Package to Orchestrator
      shell: pwsh
      env:
        UIPATH_ORCHESTRATOR_URL: 'https://cloud.uipath.com/your-org-name/' # <--- IMPORTANT: Update your Orchestrator URL
        UIPATH_TENANT_NAME: 'Default' # <--- IMPORTANT: Update your Tenant Name
        UIPATH_API_KEY: ${{ secrets.UIPATH_API_KEY }} # Retrieve from GitHub Secrets
      run: |
        $cli_full_path = "uipcli" # The setup-uipath-cli action adds 'uipcli' to PATH

        # Find the .nupkg file in the downloaded artifacts
        $nupkg_files = Get-ChildItem -Path "${{ github.workspace }}\downloaded_packages" -Filter "*.nupkg"
        if ($nupkg_files.Count -eq 0) {
            Write-Error "CRITICAL ERROR: No .nupkg file found in downloaded artifacts. Deployment cannot proceed."
            exit 1
        }
        $nupkg_to_deploy = $nupkg_files[0].FullName # Take the first nupkg found

        Write-Host "Deploying UiPath package '$nupkg_to_deploy' to Orchestrator..."
        Write-Host "Orchestrator URL: $env:UIPATH_ORCHESTRATOR_URL"
        Write-Host "Tenant Name: $env:UIPATH_TENANT_NAME"
        
        # Execute the deploy command using 'orchestrator deploy-package'
        # The API key is sourced from the environment variable (UIPATH_API_KEY)
        & "$cli_full_path" orchestrator deploy-package `
          --input "$nupkg_to_deploy" `
          --orchestrator-url "$env:UIPATH_ORCHESTRATOR_URL" `
          --tenant-name "$env:UIPATH_TENANT_NAME" `
          --api-key "$env:UIPATH_API_KEY" `
          --wait `
          --wait-timeout 300 # Wait for 5 minutes

        Write-Host "Deployment command finished."
