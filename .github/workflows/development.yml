name: Development workflow

on:
  push:
    branches:
      - develop

# Here the environment variables are declared in workflow level
env:
  PROJECT_NAME: Addition_of_2_Numbers # !! IMPORTANT: Update this to your exact UiPath project name !!
  PROJECT_FOLDER: . # Adjust if your project.json is in a subfolder relative to the repo root (e.g., 'MyRPAProject')
  ORCH_URL: https://cloud.uipath.com # Typically this is correct for Cloud Orchestrator
  ORCH_TENANT: ${{ secrets.ORCH_TENANT }}
  ORCH_CLIENT_ID: ${{ secrets.ORCH_CLIENT_ID }}
  ORCH_CLIENT_SECRET: ${{ secrets.ORCH_CLIENT_SECRET }}
  ORCH_DEV_FOLDER_PATH: Shared # !! IMPORTANT: Change this if your Development Orchestrator Folder is NOT "Shared" !!
  ORCH_ORGANIZATION_NAME: ${{ secrets.ORCH_ORGANIZATION_NAME }} # Required for cloud.uipath.com login

jobs:
  print-details:
    runs-on: ubuntu-latest
    steps:
      - name: echo-default-env-variables
        run: |
          echo "Home: ${HOME}"
          echo "GITHUB_WORKFLOW: ${GITHUB_WORKFLOW}"
          echo "GITHUB_ACTIONS: ${GITHUB_ACTIONS}"
          echo "GITHUB_ACTOR: ${GITHUB_ACTOR}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "GITHUB_EVENT_NAME: ${GITHUB_EVENT_NAME}"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "GITHUB_REF: ${GITHUB_REF}"

  cleaner:
    runs-on: ubuntu-latest
    steps:
      - name: Runner workspace path
        run: |
          echo "Cleaning up previous run"
          rm -rf "${{ github.workspace }}"

  build-uipath-nuget-package:
    needs: cleaner
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Setup NuGet.exe
        uses: NuGet/setup-nuget@v1 # Using a dedicated action for NuGet setup

      - name: Install UiPath CLI (UiPath.CLI package)
        shell: pwsh
        run: |
          $cliInstallDir = "${{ github.workspace }}\uipathcli"
          $cliPackageId = "UiPath.CLI" 
          $cliPackageVersion = "23.4.1" # Targeting the specific UiPath.CLI package version
          $nugetFeed = "https://www.myget.org/F/uipath/api/v3/index.json" # MyGet feed for UiPath tools

          Write-Host "Creating CLI installation directory: $cliInstallDir"
          New-Item -ItemType Directory -Path $cliInstallDir -Force | Out-Null

          Write-Host "Installing package '$cliPackageId' v$cliPackageVersion into $cliInstallDir using nuget.exe from $nugetFeed"
          # Use nuget.exe to install the UiPath.CLI package
          nuget install $cliPackageId -Version $cliPackageVersion -OutputDirectory $cliInstallDir -Source $nugetFeed -NoCache -ExcludeVersion
          # -ExcludeVersion puts the package content directly in $cliInstallDir/$cliPackageId
          # Without -ExcludeVersion, it would be in $cliInstallDir/$cliPackageId.$cliPackageVersion

          # Expected path to uipath.cli.exe within the extracted package
          # This is the directory created by nuget install
          $extractedPackageRoot = Join-Path $cliInstallDir $cliPackageId 
          $cliExePath = Join-Path $extractedPackageRoot "tools\uipath.cli.exe" # <-- IMPORTANT: Changed to uipath.cli.exe
          
          # The uipath.cli.exe will be inside a tools folder within the extracted NuGet package
          $extractedCliToolsDir = Join-Path $extractedPackageRoot "tools"
          
          Write-Host "Adding UiPath CLI tools directory to PATH: $extractedCliToolsDir"
          Add-Content -Path $env:GITHUB_PATH -Value $extractedCliToolsDir

          Write-Host "Verifying uipath.cli.exe presence and version..."
          if (Test-Path $cliExePath) {
              Write-Host "uipath.cli.exe found at: $cliExePath"
              & $cliExePath --version # Verify version
              & $cliExePath help # Use 'help' for v2 CLI, not --help
          } else {
              Write-Error "uipath.cli.exe not found after installation! Expected at: $cliExePath"
              Write-Host "Listing contents of ${cliInstallDir}:" 
              Get-ChildItem -Path $cliInstallDir -Recurse -Force | Format-Table -AutoSize
              exit 1
          }
      
      - name: Verify Extracted CLI Content and Commands (Diagnostic)
        shell: pwsh
        run: |
          $cliInstallDir = "$env:GITHUB_WORKSPACE\uipathcli"
          $cliPackageId = "UiPath.CLI"
          $cliExePath = Join-Path $cliInstallDir "$cliPackageId\tools\uipath.cli.exe" # <-- IMPORTANT: Changed to uipath.cli.exe
          
          Write-Host "Listing contents of ${cliInstallDir}:"
          Get-ChildItem -Path $cliInstallDir -Recurse -Force | Format-Table -AutoSize
          
          if (Test-Path $cliExePath) {
              Write-Host "${cliExePath} exists!"
              Write-Host "Running '${cliExePath} --version':"
              & $cliExePath --version
              Write-Host "Running '${cliExePath} help':" # <-- IMPORTANT: Changed to 'help'
              & $cliExePath help
          } else {
              Write-Error "${cliExePath} NOT FOUND! This should not happen at this stage."
              exit 1
          }

      - name: Build Nuget Package
        shell: pwsh
        run: |
          # This script will now use uipath.cli.exe
          "${{ github.workspace }}\scripts\UiPathPack.ps1" `
          -project_path "${{ github.workspace }}\${{ env.PROJECT_FOLDER }}\${{ env.PROJECT_NAME }}\project.json" `
          -output_path "${{ github.workspace }}\package"

      - name: Upload UiPath Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            package/*.*
            scripts/*.ps1

  publish-uipath-nuget-package:
    needs: build-uipath-nuget-package
    runs-on: windows-latest
    steps:
      - name: Download UiPath Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Artifacts
      
      - name: Setup NuGet.exe (for Publish Job)
        uses: NuGet/setup-nuget@v1 # Using a dedicated action for NuGet setup

      - name: Install UiPath CLI (for Publish Job - UiPath.CLI package)
        shell: pwsh
        run: |
          $cliInstallDir = "$env:GITHUB_WORKSPACE\uipathcli"
          $cliPackageId = "UiPath.CLI" 
          $cliPackageVersion = "23.4.1" 
          $nugetFeed = "https://www.myget.org/F/uipath/api/v3/index.json"

          Write-Host "Creating CLI installation directory: $cliInstallDir"
          New-Item -ItemType Directory -Path $cliInstallDir -Force | Out-Null

          Write-Host "Installing package '$cliPackageId' v$cliPackageVersion into $cliInstallDir using nuget.exe from $nugetFeed"
          nuget install $cliPackageId -Version $cliPackageVersion -OutputDirectory $cliInstallDir -Source $nugetFeed -NoCache -ExcludeVersion

          $extractedPackageRoot = Join-Path $cliInstallDir $cliPackageId 
          $cliExePath = Join-Path $extractedPackageRoot "tools\uipath.cli.exe" # <-- IMPORTANT: Changed to uipath.cli.exe
          
          $extractedCliToolsDir = Join-Path $extractedPackageRoot "tools"
          
          Write-Host "Adding UiPath CLI tools directory to PATH: $extractedCliToolsDir"
          Add-Content -Path $env:GITHUB_PATH -Value $extractedCliToolsDir

      - name: Verify Extracted CLI Content and Commands (Publish Job - Diagnostic)
        shell: pwsh
        run: |
          $cliInstallDir = "$env:GITHUB_WORKSPACE\uipathcli"
          $cliPackageId = "UiPath.CLI"
          $cliExePath = Join-Path $cliInstallDir "$cliPackageId\tools\uipath.cli.exe" # <-- IMPORTANT: Changed to uipath.cli.exe
          
          Write-Host "Listing contents of ${cliInstallDir}:"
          Get-ChildItem -Path $cliInstallDir -Recurse -Force | Format-Table -AutoSize
          
          if (Test-Path $cliExePath) {
              Write-Host "${cliExePath} exists!"
              Write-Host "Running '${cliExePath} --version':"
              & $cliExePath --version
              Write-Host "Running '${cliExePath} help':" # <-- IMPORTANT: Changed to 'help'
              & $cliExePath help
          } else {
              Write-Error "${cliExePath} NOT FOUND! This should not happen at this stage."
              exit 1
          }

      - name: Publish Nuget Package to DEV
        shell: pwsh
        run: |
          # This script will now use uipath.cli.exe
          "${{ github.workspace }}\scripts\UiPathDeploy.ps1" `
          -packages_path "${{ github.workspace }}\package" `
          -orchestrator_url "${{ env.ORCH_URL }}" `
          -organization_name "${{ env.ORCH_ORGANIZATION_NAME }}" `
          -orchestrator_tenant "${{ env.ORCH_TENANT }}" `
          -client_id "${{ env.ORCH_CLIENT_ID }}" `
          -client_secret "${{ env.ORCH_CLIENT_SECRET }}" `
          -folder_organization_unit "${{ env.ORCH_DEV_FOLDER_PATH }}"

  create-pull-request:
    needs: publish-uipath-nuget-package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2
      - name: pull-request
        uses: repo-sync/pull-request@v2
        with:
          destination_branch: "master"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_label: "feature, automated pr"
          pr_title: "Pull Request From Github Action"
