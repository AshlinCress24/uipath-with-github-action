name: Development workflow

on:
  push:
    branches:
      - develop

# Here the environment variables are declared in workflow level
env:
  PROJECT_NAME: Addition_of_2_Numbers # !! IMPORTANT: Update this to your exact UiPath project name !!
  PROJECT_FOLDER: . # Adjust if your project.json is in a subfolder relative to the repo root (e.g., 'MyRPAProject')
  ORCH_URL: https://cloud.uipath.com # Typically this is correct for Cloud Orchestrator
  ORCH_TENANT: ${{ secrets.ORCH_TENANT }}
  ORCH_CLIENT_ID: ${{ secrets.ORCH_CLIENT_ID }}
  ORCH_CLIENT_SECRET: ${{ secrets.ORCH_CLIENT_SECRET }}
  ORCH_DEV_FOLDER_PATH: Shared # !! IMPORTANT: Change this if your Development Orchestrator Folder is NOT "Shared" !!
  ORCH_ORGANIZATION_NAME: ${{ secrets.ORCH_ORGANIZATION_NAME }} # Required for cloud.uipath.com login

jobs:
  print-details:
    runs-on: ubuntu-latest
    steps:
      - name: echo-default-env-variables
        run: |
          echo "Home: ${HOME}"
          echo "GITHUB_WORKFLOW: ${GITHUB_WORKFLOW}"
          echo "GITHUB_ACTIONS: ${GITHUB_ACTIONS}"
          echo "GITHUB_ACTOR: ${GITHUB_ACTOR}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "GITHUB_EVENT_NAME: ${GITHUB_EVENT_NAME}"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "GITHUB_REF: ${GITHUB_REF}"

  cleaner:
    runs-on: ubuntu-latest
    steps:
      - name: Runner workspace path
        run: |
          echo "Cleaning up previous run"
          rm -rf "${{ github.workspace }}"

  build-uipath-nuget-package:
    needs: cleaner
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Manually Setup UiPath CLI (Direct Download & Extract)
        shell: pwsh
        run: |
          $cliDir = "${{ github.workspace }}\uipathcli"
          $installPath = $cliDir # Base directory for CLI installation
          $cliPackageId = "UiPath.CLI" 
          $cliPackageVersion = "23.4.1" 
          
          # Direct download URL for the .nupkg from MyGet
          $nupkgDownloadUrl = "https://www.myget.org/F/uipath/api/v2/package/$cliPackageId/$cliPackageVersion"
          # Path where the .nupkg will be saved
          $downloadedNupkgPath = Join-Path $installPath "$cliPackageId.$cliPackageVersion.nupkg"
          # Path where the content of the .nupkg will be extracted (e.g., D:\a\...\uipathcli\UiPath.CLI.23.4.1)
          $extractedPackageDir = Join-Path $installPath "$cliPackageId.$cliPackageVersion" 
          # Expected path to uipcli.exe within the extracted package
          $cliExePath = Join-Path $extractedPackageDir "tools\uipcli.exe" 

          Write-Host "Creating CLI directory: $installPath"
          New-Item -ItemType Directory -Path $installPath -Force | Out-Null

          Write-Host "Downloading UiPath CLI package '$cliPackageId' v$cliPackageVersion from $nupkgDownloadUrl to $downloadedNupkgPath"
          # Download the .nupkg file
          # -UseBasicParsing is often needed for Invoke-WebRequest in CI environments
          Invoke-WebRequest -Uri $nupkgDownloadUrl -OutFile $downloadedNupkgPath -UseBasicParsing

          # Check if download was successful
          if (-not (Test-Path $downloadedNupkgPath)) {
              Write-Error "Failed to download $cliPackageId.$cliPackageVersion.nupkg. Exiting."
              exit 1
          }

          Write-Host "Extracting $downloadedNupkgPath to $extractedPackageDir"
          # .nupkg files are just .zip files, so we can rename and extract
          Rename-Item -Path $downloadedNupkgPath -NewName "$downloadedNupkgPath.zip"
          Expand-Archive -Path "$downloadedNupkgPath.zip" -DestinationPath $extractedPackageDir -Force

          # The uipcli.exe will be inside a tools folder within the extracted NuGet package
          $extractedCliToolsDir = Join-Path $extractedPackageDir "tools"

          Write-Host "Adding UiPath CLI tools directory to PATH: $extractedCliToolsDir"
          # Add the tools directory to the GitHub Actions PATH for the current job
          Add-Content -Path $env:GITHUB_PATH -Value $extractedCliToolsDir

          Write-Host "Verifying uipcli.exe presence and version..."
          if (Test-Path $cliExePath) {
              Write-Host "uipcli.exe found at: $cliExePath"
              & $cliExePath --version # Verify version
              & $cliExePath --help    # Verify help output
          } else {
              Write-Error "uipcli.exe not found after extraction! Expected at: $cliExePath"
              # List directory contents for debugging if uipcli.exe is still not found
              # FIX: Use ${} for variable delimitation
              Write-Host "Listing contents of ${extractedPackageDir}:" 
              Get-ChildItem -Path $extractedPackageDir -Recurse -Force | Format-Table -AutoSize
              exit 1
          }
      
      - name: Verify Extracted CLI Content and Commands (Diagnostic)
        shell: pwsh
        run: |
          # The path is already in GITHUB_PATH from the previous step, so uipcli.exe should be directly executable.
          # However, for explicit checks and to match the scripts' expected paths, we use the full path.
          $cliDir = "$env:GITHUB_WORKSPACE\uipathcli"
          $cliExePath = Join-Path $cliDir "UiPath.CLI.23.4.1\tools\uipcli.exe" 
          
