name: UiPath CI/CD Workflow

on:
  push:
    branches:
      - develop # Trigger on pushes to the develop branch

jobs:
  build:
    runs-on: windows-latest # Use a Windows runner for UiPath CLI

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up PowerShell environment
      shell: pwsh
      run: |
        # Temporarily bypass execution policy for the session to ensure scripts can run
        Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
        Write-Host "Current working directory: $(Get-Location)"
        Write-Host "Listing contents of 'scripts' directory:"
        Get-ChildItem -Path ".\scripts" -Recurse -Force | Format-Table -AutoSize

    - name: Download and Setup UiPath CLI
      shell: pwsh
      env:
        # These will be set by the DownloadUiPathCli.ps1 script via GITHUB_ENV.
        # Initialize them as empty strings if they are expected to be populated.
        UIPATH_CLI_FULL_PATH: ''
        UIPATH_CLI_DIR: ''
      run: |
        Write-Host "Attempting to execute DownloadUiPathCli.ps1..."
        
        # Read the content of the DownloadUiPathCli.ps1 script itself on the runner for debugging
        Write-Host "--- Content of DownloadUiPathCli.ps1 on Runner ---"
        Get-Content ".\scripts\DownloadUiPathCli.ps1" | ForEach-Object { Write-Host "  $_" }
        Write-Host "--------------------------------------------------"
        
        # Execute the PowerShell script to download and set up the CLI
        .\scripts\DownloadUiPathCli.ps1 -WorkspacePath "${{ github.workspace }}"
        
        # Info: UIPATH_CLI_FULL_PATH will be set for subsequent steps. Current step's check relies on DownloadUiPathCli.ps1 internal validation.

    - name: Verify UiPath CLI Contents and Version (Build Job)
      shell: pwsh
      run: |
        Write-Host "--- Verifying UiPath CLI Setup ---"
        # Display the environment variables set by the previous step
        Write-Host "UiPath CLI Full Path from environment: ${{ env.UIPATH_CLI_FULL_PATH }}"
        Write-Host "UiPath CLI Directory from environment: ${{ env.UIPATH_CLI_DIR }}"
        
        # Retrieve the paths from the environment variables
        $cli_full_path = "${{ env.UIPATH_CLI_FULL_PATH }}"
        $cli_dir = "${{ env.UIPATH_CLI_DIR }}"
        
        # Critical check: Ensure the executable path is actually set by the previous step
        if ([string]::IsNullOrEmpty($cli_full_path)) {
            Write-Error "ERROR: UIPATH_CLI_FULL_PATH environment variable was not set by the previous step. Cannot verify CLI."
            exit 1
        }
        
        # Check if the executable file actually exists at the reported path
        if (-not (Test-Path $cli_full_path -PathType Leaf)) {
            Write-Error "UiPath CLI executable '$cli_full_path' not found at expected path."
            Write-Host "Listing contents of the expected CLI directory: $cli_dir"
            Get-ChildItem -Path $cli_dir -Recurse -Force | Format-Table -AutoSize
            exit 1
        }
        
        Write-Host "UiPath CLI executable found at: $cli_full_path"
        
        # Get file size and last write time to confirm it's the new, correct one
        $fileInfo = Get-Item $cli_full_path
        Write-Host "File Size: $($fileInfo.Length) bytes"
        Write-Host "Last Write Time: $($fileInfo.LastWriteTime)"
        
        # UPDATED: Expected size for the new CLI is around 20MB
        $expectedMinSize = 19000000 # Minimum expected size for the current CLI (approx 20MB)
        $expectedMaxSize = 21000000 # Maximum expected size for the current CLI (approx 20MB)
        
        if ($fileInfo.Length -lt $expectedMinSize -or $fileInfo.Length -gt $expectedMaxSize) {
            Write-Error "CRITICAL ERROR: UiPath CLI executable size is unexpected. Expected between $expectedMinSize and $expectedMaxSize bytes, but found $($fileInfo.Length) bytes. This indicates an old or corrupted CLI. Failing this step."
            exit 1
        } else {
            Write-Host "UiPath CLI executable size is within expected range. ($($fileInfo.Length) bytes)"
        }
        
        Write-Host "Running '$cli_full_path --help' to check commands..."
        & "$cli_full_path" --help
        
        Write-Host "Attempting to get UiPath CLI version..."
        $versionFound = $false
        
        # Try/Catch for version commands to prevent step failure on non-critical errors
        try {
            # 1. Try running the executable directly to see if it prints version info
            # Redirect stderr to stdout (2>&1) and then process as string.
            # Use -ErrorAction SilentlyContinue for the external command to prevent PS from throwing.
            $rawOutput = & "$cli_full_path" 2>&1 | Out-String -ErrorAction SilentlyContinue
            if ($rawOutput -match "version (\d+\.\d+\.\d+)") { # Look for a pattern like "version X.Y.Z"
                Write-Host "UiPath CLI Version (from raw output): $($Matches[1])"
                $versionFound = $true
            } elseif ($rawOutput -match "UiPath Command-Line Interface (\d+\.\d+\.\d+)") { # Another common pattern
                 Write-Host "UiPath CLI Version (from raw output): $($Matches[1])"
                 $versionFound = $true
            } else {
                Write-Host "Info: Raw '$cli_full_path' output did not contain clear version info."
            }

            # 2. If not found, try a common subcommand with a version flag, e.g., 'identity'
            if (-not $versionFound) {
                Write-Host "Trying '$cli_full_path identity --version'..."
                try {
                    # Explicitly suppress errors for this command
                    $identityVersionOutput = & "$cli_full_path" identity --version 2>&1 | Out-String -ErrorAction SilentlyContinue
                    if ($identityVersionOutput -match "version (\d+\.\d+\.\d+)") {
                        Write-Host "UiPath CLI Version (from 'identity --version'): $($Matches[1])"
                        $versionFound = $true
                    } else {
                        Write-Host "Info: '$cli_full_path identity --version' did not produce a clear version string."
                        Write-Host "Output: $identityVersionOutput"
                    }
                } catch {
                    Write-Host "Warning: '$cli_full_path identity --version' failed or is not supported. Error: $($_.Exception.Message)"
                }
            }
        }
        catch {
            # This catch block will only execute if a *terminating* error occurred.
            Write-Host "Warning: A terminating error occurred while attempting to get UiPath CLI version. Error: $($_.Exception.Message)"
        }
        finally {
            if (-not $versionFound) {
                Write-Host "Info: Could not reliably retrieve UiPath CLI version using common methods."
                Write-Host "Proceeding with verification. Relying on --help success and file size check."
                # We do NOT exit 1 here, as the primary goal (CLI existence and basic functionality) has passed.
            }
        }
        
        # IMPORTANT: At the end of this step, ensure no non-zero exit code is propagated from non-critical checks.
        # If any command inside the 'run' block exits with a non-zero code, the step will fail.
        # If all critical checks (path, existence, size, --help) passed, we can ensure the step exits with 0.
        exit 0 # Explicitly exit with 0 to ensure the step passes if all critical checks were successful.

        # Further UiPath CLI commands would go here, e.g., for packing/deploying
        # - name: UiPath Pack
        #   shell: pwsh
        #   run: |
        #     Write-Host "Packing UiPath project..."
        #     & "${{ env.UIPATH_CLI_FULL_PATH }}" pack --input path/to/your/project.json --output path/for/nuget/package
        
        # - name: UiPath Deploy
        #   shell: pwsh
        #   run: |
        #     Write-Host "Deploying UiPath package..."
        #     & "${{ env.UIPATH_CLI_FULL_PATH }}" deploy --input path/to/your/package.nupkg --orchestrator-url "https://cloud.uipath.com/your-org-name/" --tenant-name "Default" --api-key "${{ secrets.UIPATH_API_KEY }}"
