name: UiPath CI/CD Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Manual fallback: download and extract UiPath CLI directly from official GitHub releases
      - name: Download and Extract UiPath CLI Manually (Fallback)
        shell: pwsh
        run: |
          $cliZip = "uipathcli.zip"
          $cliUrl = "https://github.com/UiPath/uipathcli/releases/latest/download/uipathcli-windows-amd64.zip"
          Invoke-WebRequest $cliUrl -OutFile $cliZip
          Expand-Archive -Force -Path $cliZip -DestinationPath "./uipathcli"
          Remove-Item $cliZip
          echo "##vso[task.prependpath]$(Resolve-Path ./uipathcli)"
          Write-Host "Added extracted UiPath CLI folder to PATH."

      # Verify that uipathcli command is available in PATH
      - name: Check UiPath CLI availability
        shell: pwsh
        run: |
          Write-Host "PATH: $env:PATH"
          $cliCmd = Get-Command "uipathcli" -ErrorAction SilentlyContinue
          if (-not $cliCmd) {
            Write-Error "ERROR: 'uipathcli' command not found in PATH."
            exit 1
          } else {
            Write-Host "'uipathcli' found at: $($cliCmd.Path)"
          }

      # Run pack script
      - name: Pack UiPath Project
        shell: pwsh
        run: pwsh ./scripts/UiPathPack.ps1 `
          -project_path "${{ github.workspace }}/project.json" `
          -output_path "${{ github.workspace }}/output_packages"

      - name: Upload UiPath Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uipath-package
          path: ${{ github.workspace }}/output_packages/*.nupkg

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Repeat manual download fallback in deploy job as well (if needed)
      - name: Download and Extract UiPath CLI Manually (Fallback)
        shell: pwsh
        run: |
          $cliZip = "uipathcli.zip"
          $cliUrl = "https://github.com/UiPath/uipathcli/releases/latest/download/uipathcli-windows-amd64.zip"
          Invoke-WebRequest $cliUrl -OutFile $cliZip
          Expand-Archive -Force -Path $cliZip -DestinationPath "./uipathcli"
          Remove-Item $cliZip
          echo "##vso[task.prependpath]$(Resolve-Path ./uipathcli)"
          Write-Host "Added extracted UiPath CLI folder to PATH."

      - name: Download UiPath Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: uipath-package
          path: ${{ github.workspace }}/downloaded_packages

      - name: Deploy UiPath Package to Orchestrator
        shell: pwsh
        env:
          ORCH_CLIENT_ID: ${{ secrets.ORCH_CLIENT_ID }}
          ORCH_CLIENT_SECRET: ${{ secrets.ORCH_CLIENT_SECRET }}
          ORCH_ORGANIZATION_NAME: ${{ secrets.ORCH_ORGANIZATION_NAME }}
          ORCH_TENANT: ${{ secrets.ORCH_TENANT }}
          ORCH_URL: ${{ secrets.ORCH_URL }}
        run: pwsh ./scripts/UiPathDeploy.ps1 `
          -packages_path "${{ github.workspace }}/downloaded_packages" `
          -orchestrator_url "${{ env.ORCH_URL }}" `
          -organization_name "${{ env.ORCH_ORGANIZATION_NAME }}" `
          -orchestrator_tenant "${{ env.ORCH_TENANT }}" `
          -client_id "${{ env.ORCH_CLIENT_ID }}" `
          -client_secret "${{ env.ORCH_CLIENT_SECRET }}" `
          -folder_organization_unit ""
