name: UiPath CI/CD Workflow

on:
  push:
    branches:
      - develop # Trigger on pushes to the develop branch

jobs:
  build_and_deploy: # Renamed job as it now includes deploy
    runs-on: windows-latest # Use a Windows runner for UiPath actions

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # The previous custom PowerShell steps for downloading and verifying
    # the generic 'uipath.exe' CLI are no longer needed for packing/deploying
    # as the dedicated UiPath actions handle their own dependencies.

    # --- Step 1: Pack UiPath Project using UiPath Action ---
    - name: Pack UiPath Project
      id: pack_project # Assign an ID to this step to reference its outputs later
      uses: uipath-actions/studio-pack-project@v1
      with:
        # IMPORTANT: Replace './YourProjectFolder/' with the actual path to your
        # UiPath project folder relative to the root of your GitHub repository.
        # This folder MUST contain your 'project.json' file.
        project-path: './YourProjectFolder/' 
        
        # Define the folder where the generated .nupkg file will be saved.
        # This path is relative to the GitHub Actions workspace.
        output-folder: './output/' 
        
        # Optional: Set the version. If not provided, it will use the project.json version.
        # If you want to dynamically set it (e.g., using GitHub run number), you can:
        # package-version: 1.0.${{ github.run_number }} 

    # --- Step 2: Deploy UiPath Package to Orchestrator using UiPath Action ---
    - name: Deploy UiPath Package to Orchestrator
      uses: uipath-actions/deploy-package@v1
      with:
        # This retrieves the full path to the .nupkg file that was created
        # in the 'Pack UiPath Project' step (which had 'id: pack_project').
        package-path: ${{ steps.pack_project.outputs.package-path }}
        
        # IMPORTANT: Update with your actual UiPath Orchestrator URL.
        # Example: 'https://cloud.uipath.com/your-organization-name/'
        orchestrator-url: 'https://cloud.uipath.com/your-org-name/' 
        
        # IMPORTANT: Update with your actual Orchestrator Tenant Name.
        # Example: 'Default' or a specific tenant name you configured.
        tenant-name: 'Default' 
        
        # Authentication method: Using an API Key (legacy, but common).
        # This secret (UIPATH_API_KEY) must be created in your GitHub repository's
        # secrets settings (Repository -> Settings -> Secrets and variables -> Actions).
        api-key: ${{ secrets.UIPATH_API_KEY }}

        # Optional: If you prefer modern authentication (recommended by UiPath for new setups),
        # uncomment and use these instead of api-key. You would need to create
        # 'UIPATH_CLIENT_ID' and 'UIPATH_CLIENT_SECRET' as GitHub Secrets.
        # client-id: ${{ secrets.UIPATH_CLIENT_ID }}
        # client-secret: ${{ secrets.UIPATH_CLIENT_SECRET }}

        # Optional: Set a timeout for the deployment step.
        # Useful for very large packages or if Orchestrator is under heavy load.
        # Default is usually 300 seconds (5 minutes).
        timeout-in-seconds: 600 # 10 minutes
        
        # Optional: Specify the release name in Orchestrator. If not provided,
        # it will use the project name from project.json.
        # release-name: 'MyAutomatedProcess'
        
        # Optional: Specify the folder path in Orchestrator where the package should be deployed.
        # If not specified, it will use the "Default" folder or the folder associated with the API key.
        # folder-path: 'Shared'
